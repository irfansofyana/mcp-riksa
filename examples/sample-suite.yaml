version: 1
name: sample-direct
description: Deterministic direct-tool regression suite for MCP Riksa.
cases:
  - id: adds-two-numbers
    kind: direct
    server: sample
    call:
      tool: add
      arguments:
        a: 20
        b: 22
    assertions:
      - type: tool_called
        tool: add
      - type: tool_count
        tool: add
        count: 1
      - type: jsonpath
        path: $.sum
        equals: 42
      - type: duration
        maxMs: 5000
  - id: echoes-text
    kind: direct
    server: sample
    call:
      tool: echo
      arguments:
        text: deterministic
    assertions:
      - type: contains
        path: $.text
        value: deterministic
