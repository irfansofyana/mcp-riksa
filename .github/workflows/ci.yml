name: MCP regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Run portable sample suite through compiled CLI
        run: node dist/src/cli/index.js run examples/sample-suite.yaml --config examples/ci-mcp-riksa.config.yaml --data-dir .mcp-riksa/ci --output reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-riksa-reports
          path: reports/
          if-no-files-found: error
